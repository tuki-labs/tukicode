[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tukicode"
version = "1.3.4"
description = "TukiCode - CLI Programming Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "ollama>=0.1.0",
    "httpx>=0.25.0",
    "pyperclip>=1.8.0",
    "google-generativeai>=0.5.0",
    "anthropic>=0.25.0",
    "textual==8.2.5",
    "pyte>=0.8.0",
    "pywinpty>=2.0; sys_platform == 'win32'",
    "ptyprocess>=0.7; sys_platform != 'win32'",
]

[project.scripts]
tuki = "tuki:main"

[tool.setuptools]
py-modules = ["tuki", "config", "agent_icon"]

[tool.setuptools.packages.find]
include = ["agent*", "core*", "ui*", "tools*", "prompts*", "integrations*"]

[tool.setuptools.package-data]
prompts = ["*.json", "*.txt"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
